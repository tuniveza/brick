<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brick kiln</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<style>
:root {
  --bg: #120c0a;
  --bg2: #1b1210;
  --panel: #211613;
  --panel2: #2a1c17;
  --line: #3a2620;
  --text: #f3e2d6;
  --dim: #b39383;
  --faint: #7a5d50;
  --ember: #ff6a1f;
  --flame: #ff9a2e;
  --gold: #ffd166;
  --white-hot: #fff3d6;
  --crimson: #d7263d;
  --deep: #8f1d21;
  --ash: #5b4038;
  --ok: #ffb347;
  --bad: #ff4d4d;
  --note: #ffd166;
  --bit1: #ffb02e;
  --bit1-glow: rgba(255, 140, 30, .55);
  --bit0: #5a2a24;
  --glow: 0 0 18px rgba(255, 106, 31, .35);
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
  --sans: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --heat: linear-gradient(90deg, #3b0d0c, #8f1d21 20%, #d7263d 40%, #ff6a1f 60%, #ff9a2e 75%, #ffd166 90%, #fff3d6);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #fbf1e8; --bg2: #f6e6d8; --panel: #fff8f1; --panel2: #f8e9dc; --line: #ead0bd;
    --text: #2a140d; --dim: #7b4f3c; --faint: #a7826f;
    --ember: #e2520c; --flame: #e9790f; --gold: #b7791f; --white-hot: #5a2a10;
    --crimson: #b81d33; --deep: #8f1d21; --ash: #c9ab9b; --ok: #c26a0a; --bad: #c81e1e; --note: #9a6a00;
    --bit1: #e2520c; --bit1-glow: rgba(226, 82, 12, .25); --bit0: #e3c6b6;
    --glow: 0 0 14px rgba(226, 82, 12, .18);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #fbf1e8; --bg2: #f6e6d8; --panel: #fff8f1; --panel2: #f8e9dc; --line: #ead0bd;
  --text: #2a140d; --dim: #7b4f3c; --faint: #a7826f;
  --ember: #e2520c; --flame: #e9790f; --gold: #b7791f; --white-hot: #5a2a10;
  --crimson: #b81d33; --deep: #8f1d21; --ash: #c9ab9b; --ok: #c26a0a; --bad: #c81e1e; --note: #9a6a00;
  --bit1: #e2520c; --bit1-glow: rgba(226, 82, 12, .25); --bit0: #e3c6b6;
  --glow: 0 0 14px rgba(226, 82, 12, .18);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(1200px 500px at 15% -10%, rgba(255, 106, 31, .10), transparent 60%),
              radial-gradient(900px 500px at 110% 110%, rgba(215, 38, 61, .10), transparent 60%), var(--bg);
  color: var(--text); font: 14px/1.5 var(--sans); overflow: hidden;
}
button, select, input { font: inherit; color: inherit; }
button { white-space: nowrap; }
button {
  background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
button:hover { border-color: var(--ember); box-shadow: var(--glow); }
button:disabled { opacity: .4; cursor: default; border-color: var(--line); box-shadow: none; }
button.hot {
  background: linear-gradient(135deg, var(--crimson), var(--ember) 60%, var(--flame)); border-color: transparent;
  color: #fff; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.35);
}
button.hot:hover { box-shadow: 0 0 22px rgba(255, 106, 31, .6); }
button.quiet { background: transparent; border-color: transparent; color: var(--dim); }
button.quiet:hover { color: var(--text); border-color: var(--line); box-shadow: none; }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--dim); }
code { font-family: var(--mono); font-size: .92em; background: var(--panel2); padding: 1px 5px; border-radius: 4px; }

/* ---- the top bar ---- */
header {
  height: 54px; display: flex; align-items: center; gap: 10px; padding: 0 14px;
  border-bottom: 1px solid var(--line); background: linear-gradient(180deg, var(--bg2), transparent);
}
.logo { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 18px; letter-spacing: .5px; margin-right: 8px; }
.logo .brick {
  width: 26px; height: 18px; border-radius: 3px; position: relative;
  background: linear-gradient(135deg, #ffd166, #ff6a1f 45%, #d7263d 80%, #8f1d21);
  box-shadow: 0 0 16px rgba(255, 106, 31, .7), inset 0 -3px 0 rgba(0,0,0,.25);
  animation: smoulder 3.5s ease-in-out infinite;
}
.logo .brick::after { content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 1px; background: rgba(0,0,0,.3); }
.logo small { font-weight: 400; color: var(--dim); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
@keyframes smoulder { 50% { box-shadow: 0 0 26px rgba(255, 140, 30, .95), inset 0 -3px 0 rgba(0,0,0,.25); filter: brightness(1.12); } }
.file { display: flex; align-items: center; gap: 6px; color: var(--dim); font-family: var(--mono); font-size: 13px; min-width: 0; }
.file b { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
.dirty { width: 8px; height: 8px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 8px var(--ember); display: none; }
.dirty.on { display: inline-block; }
.spacer { flex: 1; }
.temp { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); white-space: nowrap; }
.temp .bulb { width: 10px; height: 10px; border-radius: 50%; background: var(--ash); }
.temp.ok .bulb { background: var(--flame); box-shadow: 0 0 10px var(--flame); }
.temp.bad .bulb { background: var(--bad); box-shadow: 0 0 10px var(--bad); }
.temp.busy .bulb { background: var(--gold); animation: flicker .6s infinite alternate; }
@keyframes flicker { to { opacity: .4; } }

/* ---- the two halves ---- */
main { display: grid; grid-template-columns: minmax(320px, 44%) 6px 1fr; height: calc(100% - 54px); }
.divider { cursor: col-resize; background: linear-gradient(180deg, transparent, var(--line), transparent); }
.divider:hover { background: linear-gradient(180deg, transparent, var(--ember), transparent); }
section.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }

/* ---- the editor ---- */
.editor { position: relative; flex: 1; min-height: 140px; display: flex; background: var(--bg2); border-right: 1px solid var(--line); }
.gutter {
  width: 52px; flex: none; overflow: hidden; position: relative; background: var(--bg);
  border-right: 1px solid var(--line); font: 13.5px/22px var(--mono); color: var(--faint); user-select: none;
}
.gutter .nums { position: absolute; left: 0; right: 0; top: 0; padding: 12px 0; }
.gutter .n { height: 22px; padding-right: 10px; text-align: right; position: relative; cursor: pointer; }
.gutter .n.cur { color: var(--flame); }
.gutter .n.bad { color: var(--bad); font-weight: 700; }
.gutter .n.bad::before, .gutter .n.warn::before {
  content: ""; position: absolute; left: 7px; top: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 8px var(--bad);
}
.gutter .n.warn::before { background: var(--note); box-shadow: 0 0 8px var(--note); }
.code-area { position: relative; flex: 1; min-width: 0; overflow: hidden; }
.code-area textarea, .code-area pre {
  position: absolute; inset: 0; margin: 0; padding: 12px 14px; border: 0; outline: 0;
  font: 13.5px/22px var(--mono); white-space: pre; tab-size: 4; overflow: auto; letter-spacing: 0;
}
.code-area pre { pointer-events: none; color: var(--text); overflow: hidden; }
.code-area textarea { background: transparent; color: transparent; caret-color: var(--flame); resize: none; z-index: 2; }
.code-area textarea::selection { background: rgba(255, 106, 31, .30); color: transparent; }
.curline { position: absolute; left: 0; right: 0; height: 22px; background: rgba(255, 106, 31, .07); border-left: 2px solid var(--ember); pointer-events: none; z-index: 0; }
.badline { position: absolute; left: 0; right: 0; height: 22px; background: rgba(255, 77, 77, .10); pointer-events: none; }
.hl .v { color: var(--flame); font-weight: 700; }
.hl .k { color: var(--crimson); font-weight: 600; }
:root[data-theme="dark"] .hl .k { color: #ff5a6e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hl .k { color: #ff5a6e; } }
.hl .q { color: var(--gold); }
.hl .num { color: #ff8fa0; }
.hl .c { color: var(--faint); font-style: italic; }
.hl .col { text-decoration: underline 3px; text-underline-offset: 4px; }
.placeholder { position: absolute; left: 14px; top: 12px; color: var(--faint); font: 13.5px/22px var(--mono); pointer-events: none; white-space: pre; }

.under {
  flex: none; max-height: 34%; overflow: auto; border-top: 1px solid var(--line); background: var(--bg);
  border-right: 1px solid var(--line); font-size: 13px;
}
.under .bar { display: flex; align-items: center; gap: 10px; padding: 6px 12px; color: var(--dim); font-size: 12px; position: sticky; top: 0; background: var(--bg); }
.problem, .notice { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; padding: 7px 12px 7px 14px; background: transparent; border-left: 3px solid var(--bad); }
.notice { border-left-color: var(--note); }
.problem:hover, .notice:hover { background: var(--panel); box-shadow: none; }
.problem b, .notice b { font-family: var(--mono); font-size: 12px; color: var(--bad); margin-right: 6px; }
.notice b { color: var(--note); }
.problem .msg { color: var(--dim); white-space: pre-wrap; font-size: 12.5px; display: block; margin-top: 2px; }

/* ---- tabs ---- */
.tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); background: var(--bg2); flex: none; overflow-x: auto; }
.tab {
  border: 1px solid transparent; border-bottom: 0; border-radius: 9px 9px 0 0; background: transparent; color: var(--dim);
  padding: 7px 14px; white-space: nowrap; position: relative; top: 1px;
}
.tab:hover { color: var(--text); box-shadow: none; border-color: transparent; }
.tab.on { background: var(--panel); color: var(--text); border-color: var(--line); }
.tab.on::after { content: ""; position: absolute; left: 12px; right: 12px; top: -1px; height: 2px; background: var(--heat); border-radius: 2px; }
.subtabs { display: flex; gap: 6px; padding: 10px 14px; flex: none; flex-wrap: wrap; border-bottom: 1px solid var(--line); background: var(--panel); }
.subtab { padding: 4px 11px; border-radius: 999px; font-size: 13px; background: transparent; color: var(--dim); }
.subtab.on { color: #fff; background: linear-gradient(135deg, var(--crimson), var(--ember)); border-color: transparent; }
.view { flex: 1; min-height: 0; overflow: auto; background: var(--panel); display: none; }
.view.on { display: block; }
.pad { padding: 16px 18px 40px; }
.empty { color: var(--faint); padding: 40px 20px; text-align: center; }

/* ---- console ---- */
#consoleView.on { display: flex; flex-direction: column; }
.console-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex: none; }
.console-bar .state { font-size: 12px; color: var(--dim); }
.console-bar .state.live { color: var(--flame); }
#term { flex: 1; min-height: 0; padding: 8px 4px 8px 10px; background: #0c0706; }
#term .xterm-viewport { background: #0c0706 !important; }
.fallback-term { height: 100%; overflow: auto; margin: 0; font: 13px/1.4 var(--mono); color: #f3e2d6; white-space: pre-wrap; outline: none; }

/* ---- overview ---- */
.forge { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; margin: 4px 0 20px; }
.stage {
  position: relative; padding: 12px 12px 12px 14px; border: 1px solid var(--line); background: var(--panel2);
  cursor: pointer; min-width: 0;
}
.stage:first-child { border-radius: 10px 0 0 10px; }
.stage:last-child { border-radius: 0 10px 10px 0; }
.stage + .stage { border-left: 0; }
.stage::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--c); box-shadow: 0 0 12px var(--c); }
.stage:hover { background: var(--panel); }
.stage .big { font: 700 20px var(--mono); color: var(--c); }
.stage .what { font-size: 12px; color: var(--dim); }
.stage .step { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--faint); }
.cards { display: flex; flex-direction: column; gap: 8px; }
.card { border: 1px solid var(--line); border-radius: 10px; background: var(--bg2); padding: 10px 12px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.card:hover { border-color: var(--ash); }
.card.sel { border-color: var(--ember); box-shadow: var(--glow); }
.card.bad { border-color: var(--bad); }
.card.quiet { padding: 4px 12px; background: transparent; border-style: dashed; color: var(--faint); font-family: var(--mono); font-size: 12.5px; }
.card .top { display: flex; gap: 10px; align-items: baseline; }
.card .no { font: 600 12px var(--mono); color: var(--faint); min-width: 26px; }
.card .src { font: 13px var(--mono); white-space: pre-wrap; word-break: break-word; flex: 1; }
.card .size { font: 12px var(--mono); color: var(--dim); white-space: nowrap; }
.heatbar { height: 4px; border-radius: 4px; margin: 8px 0 2px 36px; background: var(--heat); background-size: 100% 100%; }
.heatbar-track { margin: 8px 0 2px 36px; height: 4px; border-radius: 4px; background: var(--panel2); overflow: hidden; }
.heatbar-track div { height: 100%; background: var(--heat); background-size: var(--w-full) 100%; border-radius: 4px; }
.pieces { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 0 36px; }
.join { font: 11px var(--mono); padding: 1px 7px; border-radius: 999px; color: var(--dim); border: 1px dashed var(--ash); text-transform: lowercase; }
.join.otherwise { color: var(--crimson); border-color: var(--crimson); }
.chip { font: 12.5px var(--mono); padding: 3px 9px; border-radius: 7px; background: var(--panel2); border: 1px solid var(--line); }
.chip .verb { color: var(--flame); font-weight: 700; }
.respell { margin: 6px 0 0 36px; font: 12px var(--mono); color: var(--dim); }
.respell s { color: var(--faint); }
.respell b { color: var(--gold); font-weight: 600; }
.whyline { margin: 6px 0 0 36px; color: var(--bad); font-size: 12.5px; white-space: pre-wrap; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--dim); margin: 0 0 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
h2 { font-size: 15px; margin: 22px 0 10px; letter-spacing: .3px; }
h2:first-child { margin-top: 0; }
h2 small { font-weight: 400; color: var(--dim); font-size: 12.5px; margin-left: 6px; }
.lead { color: var(--dim); margin: -4px 0 14px; max-width: 70ch; }

/* ---- machine code ---- */
.run { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; overflow: hidden; background: var(--bg2); }
.run.sel { border-color: var(--ember); box-shadow: var(--glow); }
.run > .head, details.routine > summary {
  display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; background: var(--panel2); cursor: pointer; list-style: none;
}
details > summary::-webkit-details-marker { display: none; }
.run .head .tag, details.routine .tag { font: 700 11px var(--mono); padding: 1px 7px; border-radius: 5px; color: #fff; background: var(--ember); white-space: nowrap; }
.run .head .tag.start { background: var(--deep); }
.run .head .tag.end, .run .head .tag.glue { background: var(--ash); }
details.routine .tag { background: #b8621b; }
.run .head .src { font: 13px var(--mono); flex: 1; white-space: pre-wrap; word-break: break-word; }
.run .head .size, details.routine .size { font: 12px var(--mono); color: var(--dim); white-space: nowrap; }
.ins { display: grid; grid-template-columns: 74px minmax(110px, 260px) minmax(160px, 1fr) minmax(0, 1fr); gap: 12px; padding: 1px 12px; font: 12.5px/20px var(--mono); }
.ins:hover { background: rgba(255, 106, 31, .06); }
.ins .a { color: var(--faint); }
.ins .b { color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ins .o { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ins .o .m { color: var(--flame); font-weight: 600; cursor: help; }
.ins .t { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--sans); font-size: 12px; }
.ins.lab { padding-top: 6px; color: var(--crimson); }
.ins.lab span { grid-column: 1 / -1; }
details.toolbox { border: 1px solid var(--line); border-radius: 10px; background: var(--bg2); margin-top: 14px; }
details.toolbox > summary { padding: 10px 12px; cursor: pointer; list-style: none; display: flex; gap: 10px; align-items: baseline; }
details.toolbox > summary b { color: var(--gold); }
details.routine { border-top: 1px solid var(--line); }
details.routine > summary { background: transparent; }
details.routine > summary .note { color: var(--dim); font-size: 12px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
details.routine > summary .name { font: 600 13px var(--mono); color: var(--gold); }
.toggle-row { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; color: var(--dim); font-size: 13px; flex-wrap: wrap; }
.toggle-row label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--ember); }

/* ---- program file ---- */
.filebar { display: flex; height: 46px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); margin-bottom: 8px; }
.filebar div { min-width: 6px; position: relative; display: flex; align-items: flex-end; padding: 4px 6px; font: 11px var(--mono); color: rgba(255,255,255,.9); overflow: hidden; white-space: nowrap; cursor: default; }
.filebar div + div { border-left: 1px solid rgba(0,0,0,.35); }
.filekey { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px 16px; font-size: 12.5px; color: var(--dim); margin-bottom: 18px; }
.filekey span { display: flex; gap: 8px; align-items: center; }
.filekey i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.filekey b { color: var(--text); font-family: var(--mono); font-weight: 600; margin-left: auto; }
.memmap { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 8px; }
.mem { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--bg2); }
.mem h3 { margin: 0 0 4px; font-size: 13px; }
.mem .addr { font: 700 16px var(--mono); color: var(--flame); }
.mem p { margin: 6px 0 0; color: var(--dim); font-size: 12.5px; }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.t th { text-align: left; color: var(--faint); font-weight: 500; padding: 5px 8px; border-bottom: 1px solid var(--line); }
table.t td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t td.m { font-family: var(--mono); }
table.t td.hx { font-family: var(--mono); color: var(--gold); }
table.t tr.mine td:first-child { color: var(--flame); font-weight: 600; }

/* ---- bytes: hex and bits ---- */
.bytes-tools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 3; }
.bytes-tools select { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; max-width: 320px; }
.peek { padding: 8px 16px; font: 12px/1.6 var(--mono); color: var(--dim); border-bottom: 1px solid var(--line); min-height: 38px; position: sticky; top: 49px; background: var(--panel); z-index: 3; }
.peek b { color: var(--text); font-weight: 600; }
.peek .hot { color: var(--bit1); }
.peek .cold { color: var(--faint); }
.dump { padding: 10px 16px 40px; font: 12.5px/19px var(--mono); }
.row { display: flex; gap: 14px; white-space: nowrap; }
.row .off { color: var(--faint); width: 64px; flex: none; user-select: none; }
.row .cells { display: flex; gap: 0; }
.row .asc { color: var(--dim); letter-spacing: 1px; }
.row .asc span { padding: 0 0; }
.hx { padding: 0 3px; cursor: pointer; border-radius: 2px; }
.hx.g8 { margin-left: 8px; }
.bt { padding: 0 3px; margin-right: 4px; cursor: pointer; border-radius: 3px; border-bottom: 2px solid transparent; }
.bt b { color: var(--bit1); font-weight: 700; text-shadow: 0 0 6px var(--bit1-glow); }
.bt i { color: var(--bit0); font-style: normal; }
.dump .hover { outline: 1px solid var(--white-hot); }
.dump .near { box-shadow: inset 0 -2px 0 var(--white-hot); }
.bytetip { position: fixed; z-index: 50; display: none; pointer-events: none; max-width: min(520px, calc(100vw - 16px));

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmt = n => n.toLocaleString("en");
const LINE_H = 22;

const state = {
  path: null, folder: "", dirty: false, result: null, sel: 1, starters: new Set(), colours: {},
  examples: [], files: [], viz: "overview", tab: "consoleView", help: "how", helpData: null,
  session: null, stale: new Set(), hexMode: "where",
};
const src = $("#src"), paint = $("#paint"), nums = $("#nums"), bands = $("#bands");

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  return r.json();
}

// ---------------- the editor ----------------

const KEYWORDS = new Set(["then", "and", "otherwise", "else", "if", "while", "until", "times", "for", "each", "in", "to", "as", "is", "not", "or", "means", "forever", "from", "with"]);
function paintLine(line) {
  if (/^\s*#/.test(line)) return `<span class="c">${esc(line)}</span>`;
  let out = "", i = 0;
  const re = /"[^"]*"?|\d+(?:\.\d+)?|[A-Za-z][A-Za-z'-]*|\s+|./g;
  const tokens = line.match(re) || [];
  for (let t = 0; t < tokens.length; t++) {
    const tok = tokens[t], low = tok.toLowerCase();
    if (tok[0] === '"') { out += `<span class="q">${esc(tok)}</span>`; continue; }
    if (/^\d/.test(tok)) { out += `<span class="num">${esc(tok)}</span>`; continue; }
    if (/^[A-Za-z]/.test(tok)) {
      // two-word colours first: "sea green", "light blue"
      if (t + 2 < tokens.length && /^\s+$/.test(tokens[t + 1]) && /^[A-Za-z]/.test(tokens[t + 2])) {
        const two = low + " " + tokens[t + 2].toLowerCase();
        if (state.colours[two]) {
          out += `<span class="col" style="text-decoration-color: rgb(${state.colours[two]})">${esc(tok + tokens[t + 1] + tokens[t + 2])}</span>`;
          t += 2; continue;
        }
      }
      if (state.colours[low] && !state.starters.has(low)) out += `<span class="col" style="text-decoration-color: rgb(${state.colours[low]})">${esc(tok)}</span>`;
      else if (state.starters.has(low) && !KEYWORDS.has(low)) out += `<span class="v">${esc(tok)}</span>`;
      else if (KEYWORDS.has(low)) out += `<span class="k">${esc(tok)}</span>`;
      else out += esc(tok);
      continue;
    }
    out += esc(tok);
  }
  return out;
}
function repaint() {
  const lines = src.value.split("\n");
  paint.innerHTML = lines.map(paintLine).join("\n") + "\n ";
  $("#placeholder").style.display = src.value ? "none" : "block";
  drawGutter();
  syncScroll();
}
function problemLines() {
  const bad = new Set(), warn = new Set();
  const r = state.result;
  if (r) {
    r.lines.forEach(l => l.problems && bad.add(l.number));
    r.notes.forEach(n => { const m = n.match(/line (\d+)/i); if (m) warn.add(+m[1]); });
  }
  return {bad, warn};
}
function drawGutter() {
  const count = src.value.split("\n").length;
  const {bad, warn} = problemLines();
  let html = "";
  for (let n = 1; n <= count; n++) {
    const cls = ["n", n === state.sel ? "cur" : "", bad.has(n) ? "bad" : warn.has(n) ? "warn" : ""].join(" ");
    html += `<div class="${cls}" data-n="${n}">${n}</div>`;
  }
  nums.innerHTML = html;
  bands.innerHTML = [...bad].map(n => `<div class="badline" style="top:${12 + (n - 1) * LINE_H}px"></div>`).join("") +
    `<div class="curline" style="top:${12 + (state.sel - 1) * LINE_H}px"></div>`;
}
function syncScroll() {

      const m = b.head.match(/^(.*?)\s+\(also: (.*)\)$/);
      return `<div class="phrase"><h4>${esc(m ? m[1] : b.head)}${m ? `<small>also ${esc(m[2])}</small>` : ""}</h4>` +
        b.examples.map(x => `<button data-example="${esc(x)}">${esc(x)}</button>`).join("") + `</div>`;
    }).join("") + `</div><div class="notes-block">${esc(notes.join("\n"))}</div>`;
}
function parseDictionary() {
  if (state.dict) return state.dict;
  const lines = state.helpData.dictionary.split("\n");
  const groups = [];
  let intro = [], entry = null;
  for (const line of lines) {
    if (!line.trim()) continue;
    if (/^\S/.test(line)) {
      if (!groups.length && /[.:]$|^They're|^Words|^brick's/.test(line)) { intro.push(line); continue; }
      groups.push({name: line.trim(), entries: []}); entry = null;
    } else if (/^ {4}\S/.test(line) && groups.length && line.indexOf(": ") < 0) {     // a plain list, like the colours
      const g = groups[groups.length - 1], last = g.entries[g.entries.length - 1];
      if (last && last.key === null) last.words += " " + line.trim();
      else g.entries.push(entry = {key: null, words: line.trim()});
    } else if (/^ {4}\S/.test(line) && groups.length) {
      const i = line.indexOf(": ");
      entry = {key: i > 0 ? line.slice(4, i) : line.trim(), words: i > 0 ? line.slice(i + 2).trim() : ""};
      groups[groups.length - 1].entries.push(entry);
    } else if (entry) entry.words += " " + line.trim();
  }
  return (state.dict = {intro, groups});
}
function dictionaryHtml(query) {
  const {groups} = parseDictionary();
  const q = (query || "").trim().toLowerCase();
  const mark = s => q ? esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`) : esc(s);
  let html = "";
  for (const g of groups) {
    const plain = g.entries.filter(e => e.key === null).flatMap(e => e.words.split(/,\s*/))
      .filter(w => w && (!q || w.toLowerCase().includes(q) || g.name.toLowerCase().includes(q)));
    const es = g.entries.filter(e => e.key !== null && (!q || (e.key + " " + e.words).toLowerCase().includes(q) || g.name.toLowerCase().includes(q)));
    if (!es.length && !plain.length) continue;
    html += `<div class="group"><h3>${esc(g.name)}</h3>` + es.map(e => `<div class="entry"><b>${mark(e.key)}</b> <span>← ${mark(e.words)}</span></div>`).join("") +
      (plain.length ? `<div class="swatches">` + plain.map(w => {
        const rgb = state.colours[w.toLowerCase()];
        return `<span class="sw">${rgb ? `<i style="background:rgb(${rgb})"></i>` : ""}${mark(w)}</span>`;
      }).join("") + `</div>` : "") + `</div>`;
  }
  return html || `<p class="dim">Nothing matches “${esc(query)}”. You can add your own words in dictionary.txt.</p>`;
}

// ---------------- start ----------------

(async function start() {
  setupTerm();
  const s = await api("/api/start");
  state.starters = new Set(s.starters);
  state.colours = s.colours;
  state.examples = s.examples;
  state.files = s.files;
  state.folder = s.folder;
  const asked = new URLSearchParams(location.search);
  if (asked.get("file") && asked.get("file") !== s.file) {
    const r = await api("/api/open", {path: asked.get("file")});
    if (r.path) { s.file = r.path; s.text = r.text; }
  }
  if (asked.get("review") && s.file) {
    setFile(s.file, s.text);
    const r = await api("/api/guessed", {text: s.text, path: s.file});
    if ((r.guessed || []).length) openReview(r.guessed); else pickLineToFix();    // nothing guessed: which line?
    history.replaceState(null, "", "/");
  } else if (s.file) setFile(s.file, s.text);
  else {
    const hello = s.examples.find(x => x.name === "hello");
    setFile(null, hello ? "# Try changing anything here; the right side keeps up as you type.\n" + hello.text : "");
  }
  src.focus();
  let tray = "off";
  try { tray = localStorage.getItem("brick-tray") || "off"; } catch (e) {}
  setTray(tray === "on");
  showLine();
})();
</script>
